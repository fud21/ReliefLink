# 실제 application.yml에 병합해서 쓰세요. serviceKey는 환경변수로 분리 권장.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/recovery_onestop
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 flyway/migration SQL로 관리, JPA는 검증만
  flyway:
    enabled: true
    locations: classpath:db/migration

bokjiro:
  service-key: ${BOKJIRO_SERVICE_KEY}
  base-url: http://apis.data.go.kr/B554287/NationalWelfareInformationsV001   # ⚠️ Swagger 확인 후 확정
  local-base-url: http://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations # ⚠️ 확인 필요
  num-of-rows: 100
